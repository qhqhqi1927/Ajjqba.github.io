<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><meta name="theme-color" content="#0b3cff"><meta name="apple-mobile-web-app-capable" content="yes"><title>ПОВТАСк-01-25(11)</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,700;1,900&family=Russo+One&family=Rubik:ital,wght@0,900&family=Oswald:wght@700&family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0a12b0;--bg2:#0b3cff;--bg3:#18c4ff;--acc:#22d3ff;--hi:#e8141c;--ink:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat',Arial,sans-serif;font-style:italic;font-weight:700;color:#fff;background:#050a3a;min-height:100vh;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit}
body.p5{--acc:#fff;--hi:#e60012}

/* ФОН */
.bg{position:fixed;inset:0;z-index:-2;background:
 radial-gradient(50% 40% at 88% 15%,rgba(255,255,255,.55),transparent 65%),
 repeating-linear-gradient(115deg,rgba(255,255,255,.07) 0 36px,transparent 36px 120px),
 linear-gradient(160deg,var(--bg1),var(--bg2) 45%,var(--bg3));animation:tide 9s ease-in-out infinite alternate}
.bg::after{content:"";position:absolute;left:-12%;top:-20%;width:42%;height:150%;background:#000;transform:skewX(-14deg);opacity:.9}
@keyframes tide{from{filter:hue-rotate(-10deg)}to{filter:hue-rotate(10deg) brightness(1.1)}}
#bub{position:fixed;inset:0;z-index:-1;pointer-events:none}
body.p5 #bub{display:none}
body.p5 .bg{background:radial-gradient(circle at 1px 1px,rgba(0,0,0,.4) 1.6px,transparent 2px) 0 0/9px 9px,repeating-linear-gradient(115deg,rgba(0,0,0,.18) 0 40px,transparent 40px 110px),#e60012;animation:dots 4s linear infinite}
body.p5 .bg::before{content:"";position:absolute;right:-10vmax;top:2vmax;width:62vmax;height:62vmax;background:#000;opacity:.4;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:spin 18s linear infinite}
@keyframes dots{to{background-position:90px 90px,0 0,0 0}}@keyframes spin{to{rotate:360deg}}

/* ВЕРХ */
.bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;gap:10px}
.plate{background:#000;border:2px solid #fff;padding:5px 20px;transform:skewX(-12deg);font-weight:900}
.plate span{display:inline-block;transform:skewX(12deg)}
body.p5 .plate{background:#fff;color:#000;border-color:#000;box-shadow:5px 5px 0 var(--hi)}
.ic{display:flex;gap:8px}
.ic button{width:40px;height:40px;border-radius:50%;background:#000;border:2px solid #fff;font-size:1.1rem;font-style:normal;transition:rotate .2s}
.ic button:hover{rotate:20deg}.ic button.off{opacity:.5;text-decoration:line-through}
body.p5 .ic button{border-color:var(--hi);box-shadow:3px 3px 0 var(--hi)}

/* ЭКРАНЫ */
.scr{position:fixed;inset:0;padding:70px 20px 20px;display:none}
.scr.on{display:block;animation:scrin .45s cubic-bezier(.2,1,.3,1)}
@keyframes scrin{from{opacity:0;translate:-60px 0;skew:-6deg}}
.ghost{position:fixed;left:2vw;bottom:2vh;font-family:'Russo One',sans-serif;font-size:min(20vw,260px);text-transform:uppercase;line-height:.85;color:rgba(255,255,255,.16);transform:rotate(-12deg);transform-origin:left bottom;white-space:nowrap;pointer-events:none;z-index:0}
body.p5 .ghost{color:rgba(0,0,0,.28)}
.hint{position:fixed;right:20px;bottom:14px;font-size:.8rem;font-weight:800;text-shadow:1px 1px 0 #000;z-index:4}
.hint b{background:#fff;color:#000;border-radius:99px;padding:1px 9px;margin:0 3px 0 10px;font-style:normal}

/* ГЛАВНОЕ МЕНЮ */
#m-menu{display:none}
#m-menu.on{display:flex;align-items:center;justify-content:flex-start}
.mm{position:relative;z-index:2;display:flex;flex-direction:column;gap:2px;margin-left:min(10vw,120px);transform:rotate(-13deg);transform-origin:center}
.mi{text-align:left;font-family:'Russo One',sans-serif;font-style:normal;text-transform:uppercase;font-size:clamp(2rem,7vw,4.4rem);line-height:1.05;color:var(--acc);padding:0 22px;transition:.15s;text-shadow:3px 3px 0 #050a3a}
.mi:hover,.mi.sel{color:#fff;transform:translateX(26px) scale(1.12);text-shadow:0 0 18px var(--acc),3px 3px 0 #050a3a}
.mi.sel::before{content:"◄ ";color:var(--acc)}
body.p5 .mi{color:#fff;text-shadow:4px 4px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000;-webkit-text-stroke:0}
body.p5 .mi.sel,body.p5 .mi:hover{color:#000;background:#fff;text-shadow:none;padding:0 22px;box-shadow:8px 8px 0 #000,0 0 0 4px #e60012;transform:translateX(24px) skewX(-8deg) scale(1.1);animation:wig .5s ease-in-out infinite alternate}
body.p5 .mi.sel::before{content:"★ ";color:var(--hi)}
@keyframes wig{to{rotate:-2.5deg}}
.cmd{position:fixed;right:5vw;top:24vh;z-index:1;font-family:'Russo One';font-size:min(13vw,150px);line-height:.95;text-align:right;transform:rotate(-8deg);pointer-events:none}
.cmd i{display:inline-block;font-style:normal;padding:0 .06em;margin:0 .02em;border-radius:3px}
body:not(.p5) .cmd i{color:#fff;opacity:.9;text-shadow:4px 4px 0 rgba(0,0,60,.6)}
body.p5 .cmd i{background:#000;color:#fff;box-shadow:4px 4px 0 #fff}
body.p5 .cmd i:nth-child(3n){background:#fff;color:#000;box-shadow:4px 4px 0 #000}
body.p5 .cmd i:nth-child(4n){background:var(--hi);color:#fff}
.dsc{position:fixed;left:50%;bottom:6vh;translate:-50% 0;z-index:3;background:#000;border:2px solid #fff;padding:8px 26px;transform:skewX(-10deg);white-space:nowrap;font-size:.9rem}
.dsc span{display:inline-block;transform:skewX(10deg)}
body.p5 .dsc{background:#fff;color:#000;border-color:#000;box-shadow:5px 5px 0 var(--hi)}
@media(max-width:720px){.cmd{top:14vh;opacity:.75}.dsc{bottom:10vh;font-size:.75rem;white-space:normal;width:86vw;text-align:center}}

/* ПОДЭКРАНЫ */
.box{position:relative;z-index:2;max-width:900px;margin:0 auto;height:100%;overflow-y:auto;padding:6px 8px 90px;scrollbar-width:none}
.ttl{background:#000;border-left:10px solid #fff;padding:8px 28px;transform:skewX(-12deg);font-family:'Russo One';font-style:normal;font-size:1.7rem;margin-bottom:14px;display:inline-block}
.ttl span{display:inline-block;transform:skewX(12deg)}
body.p5 .ttl{background:var(--hi);border-left-color:#000;box-shadow:6px 6px 0 #000}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:#000;border:2px solid #fff;padding:5px 16px;border-radius:99px;font-size:.9rem;transform:skewX(-8deg)}
.chip.on{background:#fff;color:#000}
body.p5 .chip.on{background:var(--hi);color:#fff}
.days{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}
.days button{font-family:'Russo One';font-style:normal;font-size:1.1rem;padding:4px 18px;color:var(--acc);transform:skewX(-10deg);white-space:nowrap;text-shadow:2px 2px 0 #000;flex:none}
.days button.on{background:var(--hi);color:#fff;box-shadow:0 0 0 3px #fff,6px 6px 0 #000}
body.p5 .days button{color:#fff}body.p5 .days button.on{background:#fff;color:#000;box-shadow:0 0 0 3px #000,6px 6px 0 var(--hi)}
.les{background:#000;border-right:6px solid var(--acc);transform:skewX(-12deg);margin-bottom:10px;animation:lin .3s both;animation-delay:calc(var(--n)*70ms)}
.in{transform:skewX(12deg);display:flex;align-items:center;gap:14px;padding:11px 22px 11px 0;flex-wrap:wrap}
.time{background:#fff;color:#000;font-weight:900;padding:8px 14px 8px 22px;min-width:130px;text-align:center;font-size:.92rem}
.txt{flex:1;min-width:150px}.txt h3{font-size:1.02rem}.txt p{color:var(--acc);font-size:.85rem;margin-top:2px}
.kind{font-size:.7rem;padding:3px 12px;border-radius:99px;background:#33389a}
.k-c .kind{background:var(--acc);color:#000}.k-z{border-right-color:var(--hi)}.k-z .kind{background:var(--hi)}
body.p5 .les{border-right-color:var(--hi)}body.p5 .time{background:var(--hi);color:#fff}body.p5 .txt p{color:#ff9aa0}
@keyframes lin{from{opacity:0;translate:-40px 0}}
.card{display:block;background:#000;border:2px solid #fff;padding:16px 26px;margin-bottom:12px;transform:skewX(-10deg);text-decoration:none;transition:.15s}
.card>*{display:block;transform:skewX(10deg)}.card small{color:var(--acc);margin-top:3px}
.card:hover{background:var(--hi);translate:12px 0}
body.p5 .card{background:#fff;color:#000;border-color:#000;box-shadow:6px 6px 0 var(--hi)}body.p5 .card small{color:#c00}
.card.p{cursor:default}.card.p:hover{background:#000;translate:0}body.p5 .card.p:hover{background:#fff}
.back{margin:14px 0 0;font-size:.9rem;background:#fff;color:#000;padding:6px 20px;transform:skewX(-10deg)}

/* ЗАСТАВКА */
#splash{position:fixed;inset:0;z-index:50;cursor:pointer;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
#splash.go{pointer-events:none}
.sp{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(135deg,#050a3a,#0a1ebe 60%,#050a3a);transition:opacity .2s}
.go .sp{opacity:0}
.t1{font-family:'Russo One';font-style:normal;font-size:min(11vw,110px);transform:skewX(-10deg);text-shadow:5px 5px 0 #e8141c,10px 10px 0 #000;animation:pop .7s cubic-bezier(.2,1.5,.4,1) both}
.t2{font-family:'Russo One';font-style:normal;font-size:min(24vw,240px);line-height:.95;color:#22d3ff;transform:skewX(-10deg);text-shadow:6px 6px 0 #000;animation:pop .7s cubic-bezier(.2,1.5,.4,1) .25s both}
.tap{position:absolute;bottom:9vh;animation:blink 1.4s infinite}
@keyframes pop{from{opacity:0;scale:1.5;translate:0 -30px}}@keyframes blink{50%{opacity:.35}}
.shard{position:absolute;inset:0;background:linear-gradient(135deg,#050a3a,#0a1ebe 60%,#050a3a);background-attachment:fixed;opacity:0;transform-origin:var(--ox) var(--oy)}
.shard::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.35),transparent 50%)}
.go .shard{opacity:1;animation:fall 1.3s cubic-bezier(.4,0,.9,.6) var(--d) forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r));opacity:0}}
.cracks{position:absolute;inset:0;width:100%;height:100%}
.cracks path{fill:none;stroke:#fff;stroke-width:2;filter:drop-shadow(0 0 4px #22d3ff);stroke-dasharray:1;stroke-dashoffset:1;animation:draw .28s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.jolt{animation:jolt .3s}@keyframes jolt{25%{translate:-8px 4px}50%{translate:7px -5px}75%{translate:-4px 3px}}
.flash{position:fixed;z-index:60;width:40px;height:40px;margin:-20px;border-radius:50%;background:#fff;pointer-events:none;animation:fl .7s ease-out forwards}
@keyframes fl{to{opacity:0;scale:70}}
body.pre .bar,body.pre .scr,body.pre .ghost,body.pre .hint{visibility:hidden}
body.intro .scr.on{animation:scrin .5s both}

/* ===== анимации ===== */
#fx{position:fixed;inset:0;z-index:100;--c:#fff;color:var(--c);background:rgba(0,0,0,0);backdrop-filter:grayscale(1);overflow:hidden;transition:background .35s,color .3s}
#fx.on{background:rgba(0,0,0,.92)}#fx.g{--c:#3dff5c}
#fx svg{position:absolute;left:50%;top:50%;translate:-50% -50%;width:min(80vmin,560px);overflow:visible;filter:drop-shadow(0 0 10px currentColor)}
#fx b{position:absolute;font-weight:900;white-space:nowrap;opacity:0}
.cl{position:absolute;top:0;height:100%;width:22vw;transform:skewX(-12deg)}
.wd{position:absolute;left:50%;top:50%;translate:-50% -50%;background:#000;color:#fff;border:4px solid #fff;padding:.1em .5em;font-size:min(11vw,110px);font-weight:900;white-space:nowrap;opacity:0;text-align:center;line-height:1.15}

#wipe{position:fixed;top:-10%;height:120%;left:0;width:100%;z-index:70;pointer-events:none;transform:skewX(-14deg);translate:-130% 0}
.pt{position:fixed;width:10px;height:10px;margin:-5px;background:var(--acc);z-index:90;pointer-events:none;transform:skewX(-20deg)}
body.p5 .pt:nth-child(odd){background:var(--hi)}
.mm.sl .mi{animation:slam .55s cubic-bezier(.2,1,.4,1) calc(var(--i)*.09s) both}
@keyframes slam{from{opacity:0;translate:-120% 0;rotate:-8deg}60%{translate:5% 0}}
.cmd i{animation:bin .6s cubic-bezier(.2,1.6,.4,1) calc(.4s + var(--i)*.1s) both,flt 3s ease-in-out calc(var(--i)*.3s) infinite alternate}
@keyframes bin{from{opacity:0;scale:2.4;translate:0 -60px}}@keyframes flt{to{translate:0 -10px}}
.ghost{animation:drift 8s ease-in-out infinite alternate}@keyframes drift{to{translate:24px -10px}}
.les:hover{translate:14px 0;scale:1.02;transition:.15s}.les{transition:.15s}
.time{animation:tf 3s steps(1) infinite}@keyframes tf{0%,94%{opacity:1}96%{opacity:.6}}
.box{touch-action:pan-y}#m-menu{touch-action:none}

.chip.cur::after{content:"●";color:var(--hi);font-size:.6em;margin-left:6px;vertical-align:middle}
body.lite *,body.lite *::before,body.lite *::after{animation:none!important;transition:none!important}
body.lite #bub,body.lite .bg::before{display:none}
body.lite .bg{filter:none}
/* телефон */
@media(max-width:720px){
 .bar{padding:10px 12px}.plate{padding:4px 12px;font-size:.8rem}.ic{gap:5px}.ic button{width:34px;height:34px;font-size:.95rem}
 .scr{padding:58px 12px 12px}.mm{margin-left:4vw}.ttl{font-size:1.2rem;padding:6px 20px}
 .time{min-width:0}.in{padding-right:14px;gap:8px}.box{padding-bottom:70px}
 .ghost{font-size:26vw;opacity:.8}.days button{font-size:.95rem;padding:4px 12px}.chip{font-size:.8rem;padding:4px 12px}
}
@media(hover:none){.hint{display:none}}
/* ПК */
@media(min-width:1000px){.box{max-width:1000px}.les:hover{box-shadow:8px 8px 0 var(--hi)}.card{max-width:640px}.hint{font-size:.9rem}}

.ring{position:fixed;z-index:60;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;pointer-events:none;border:5px solid var(--acc);animation:ringa .9s ease-out forwards}
@keyframes ringa{from{opacity:1;scale:1}to{opacity:0;scale:45}}
.now{position:fixed;left:20px;bottom:14px;z-index:6;background:#000;border-left:8px solid var(--hi);padding:6px 18px 8px 14px;transform:skewX(-10deg);box-shadow:5px 5px 0 rgba(255,255,255,.9);animation:nowin .7s cubic-bezier(.2,1.3,.4,1) both}
.now>*{transform:skewX(10deg);display:block}.now .cd{font-size:.8rem}.now .ct{font-family:'Russo One';font-style:normal;font-size:1.8rem;color:var(--acc);font-variant-numeric:tabular-nums}
.now .sc{display:inline-block;color:var(--hi)}
body.p5 .now{background:#fff;color:#000;border-left-color:#000;box-shadow:5px 5px 0 var(--hi)}body.p5 .now .ct{color:#000}
body.pre .now{visibility:hidden}
@keyframes nowin{from{opacity:0;translate:-120% 0}}
.bg::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.16) 50%,transparent 60%);animation:sweep 7s ease-in-out infinite}
@keyframes sweep{from{translate:-100% 0}to{translate:100% 0}}
body.p5 .plate{animation:glit 3s steps(1) infinite}@keyframes glit{0%,90%{translate:0}92%{translate:-5px 2px}95%{translate:5px -2px}}
.scr.on .ttl{animation:slam .5s cubic-bezier(.2,1,.4,1) both}
.scr.on .card{animation:slam .5s cubic-bezier(.2,1,.4,1) both}.scr.on .card:nth-of-type(2){animation-delay:.1s}.scr.on .card:nth-of-type(3){animation-delay:.2s}.scr.on .card:nth-of-type(4){animation-delay:.3s}
.scr.on .chip{animation:pop2 .4s cubic-bezier(.2,1.8,.4,1) both}.chip:nth-child(2){animation-delay:.08s!important}.chip:nth-child(3){animation-delay:.16s!important}
@keyframes pop2{from{opacity:0;scale:.3}}
.mi.sel{animation:mipulse 1s ease-in-out infinite alternate}@keyframes mipulse{to{letter-spacing:.06em}}

.chip:hover,.days button:hover{scale:1.1;transition:.12s}
@media(max-width:720px){.now{left:8px;bottom:8px;padding:3px 10px 5px 8px}.now .ct{font-size:1.2rem}.now .cd{font-size:.65rem}}

#ls{position:relative}.pv{position:absolute;left:0;right:0;top:0;pointer-events:none}
.dn{font-family:'Russo One';font-style:normal;font-size:1.3rem;color:#fff;background:var(--hi);display:inline-block;padding:2px 18px;margin-bottom:10px;transform:skewX(-10deg);box-shadow:4px 4px 0 #000}
.box{overflow-x:hidden}
.swh{position:fixed;top:42%;z-index:30;pointer-events:none;font-family:'Russo One';font-style:normal;font-size:min(14vw,80px);color:#fff;text-shadow:3px 3px 0 #000;opacity:0;white-space:nowrap;transform:skewX(-10deg)}
.days button.nx{color:#fff;scale:1.15;text-shadow:0 0 12px var(--acc),2px 2px 0 #000}
.days button.on{animation:dpulse 1.2s ease-in-out infinite alternate}@keyframes dpulse{to{box-shadow:0 0 0 3px #fff,6px 6px 0 #000,0 0 22px var(--hi)}}
.les::after{content:"";position:absolute;top:0;bottom:0;width:30%;left:-40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);transform:skewX(-20deg);animation:lsh 4.5s ease-in-out infinite;animation-delay:calc(var(--n)*.6s + 1s)}
.les{position:relative;overflow:hidden}@keyframes lsh{60%,100%{left:140%}}
body:not(.p5)::before{content:"";position:fixed;inset:-50%;z-index:-1;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.06) 0 5deg,transparent 5deg 13deg);animation:spin 60s linear infinite;pointer-events:none}
.plate::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);translate:-120% 0;animation:psh 3.5s ease-in-out infinite}.plate{position:relative;overflow:hidden}
@keyframes psh{50%,100%{translate:120% 0}}
body.lite::before,body.lite .les::after,body.lite .plate::after{display:none}

/* ===== меню как в P3R / P5R ===== */
#art{position:fixed;left:0;top:0;height:100%;width:min(70vw,560px);z-index:1;pointer-events:none;opacity:.95}
.a5{display:none}body.p5 .a5{display:block}body.p5 .a3{display:none}
.hair{transform-origin:0 0;animation:sway3 3s ease-in-out infinite alternate}@keyframes sway3{to{transform:rotate(4deg) translateX(10px)}}
.fg{transform-box:fill-box;transform-origin:50% 100%;animation:fgw .5s ease-in-out infinite alternate}.fg:nth-child(2){animation-delay:.12s}.fg:nth-child(3){animation-delay:.24s}.fg:nth-child(4){animation-delay:.36s}
@keyframes fgw{to{rotate:5deg}}.shd{animation:shd .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0 50%}@keyframes shd{to{scale:1.08 .95}}
.mq{position:fixed;left:-10vw;top:14vh;z-index:0;width:300vw;white-space:nowrap;rotate:-12deg;font-family:'Russo One';font-size:min(12vw,110px);color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.25);pointer-events:none;animation:mqa 14s linear infinite}
.mq.r2{top:52vh;animation-direction:reverse;animation-duration:9s;-webkit-text-stroke-color:rgba(255,255,255,.18)}
body.p5 .mq{-webkit-text-stroke-color:rgba(0,0,0,.35)}
@keyframes mqa{to{translate:-33% 0}}
#m-menu:not(.on) .mq,#m-menu:not(.on) #art{display:none}
.mm{margin-left:clamp(40px,24vw,320px);gap:0}
#mm .mi{position:relative;font:italic 700 clamp(2.2rem,10vw,4.6rem)/.85 'Oswald',sans-serif;letter-spacing:-.02em;text-transform:uppercase;padding:.06em .3em;color:#8be6ff;text-shadow:none!important;scale:var(--s,1);translate:var(--x,0) 0;transform:skewX(-8deg);background:none;box-shadow:none;transition:color .15s}
#mm .mi::before{content:none!important}
#mm .mi:hover,#mm .mi.sel{transform:skewX(-8deg);color:#000;scale:var(--s,1)}
#mm .mi.sel{background:#fff;clip-path:polygon(0 24%,100% 0,96% 78%,2% 100%);padding:.12em .5em}
#mm .mi.sel::after{content:"";position:absolute;left:-3%;top:46%;width:72%;height:15%;background:#e8141c;transform:skewY(-9deg);z-index:-1}
.lt{display:inline-block;animation:lw 1.1s ease-in-out infinite alternate calc(var(--k)*.07s)}@keyframes lw{from{translate:0 -2px}to{translate:0 3px}}
body.p5 #mm .mi{color:#fff;font-size:clamp(1.7rem,7.5vw,3.2rem);line-height:1;padding:.05em .2em}
body.p5 .lt{font-family:var(--f);font-size:var(--fs);background:var(--bg);color:var(--c);rotate:var(--r);padding:0 .06em;margin:0 .012em;text-transform:none;box-shadow:0 0 0 .05em #000}
